name: Website

# Publishes website/ to GitHub Pages when the site (or the app code it embeds) changes, or by hand
# from the Actions tab. Not on release: the github-pages environment only accepts deployments from main,
# and the download buttons read the latest release in the browser, so they never go stale.
# One-time setup: repo Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/components/hud/**"
      - "src/data/defaultProfiles.ts"
      - "src/types/**"
      - "src/utils/iconMap.tsx"
      - "src/utils/donutGeometry.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Defaults serve https://<owner>.github.io/dial-control/. For a custom domain set these
          # as repository variables: SITE_URL=https://example.com and SITE_BASE=/
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

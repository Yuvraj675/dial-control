name: Build macOS Release

# Manual only: run it from the Actions tab ("Run workflow").
on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri macOS bundles (.dmg & .app)
        run: |
          npx @tauri-apps/cli build
          # Zip the .app directory to preserve execution permissions and symlinks
          for app_dir in src-tauri/target/**/bundle/macos/*.app; do
            if [ -d "$app_dir" ]; then
              parent_dir="$(dirname "$app_dir")"
              base_name="$(basename "$app_dir")"
              (cd "$parent_dir" && zip -r "${base_name}.zip" "$base_name")
            fi
          done

      - name: Upload macOS Installers
        uses: actions/upload-artifact@v4
        with:
          name: dial-control-macos
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.zip
          if-no-files-found: warn
